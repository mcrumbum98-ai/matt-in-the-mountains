<main>
  <section class="collection-gallery">
    <div class="wrap">
      <a class="collection-gallery__back" href="photography.html">Back to Photography</a>

      <header class="collection-gallery__intro" id="collection-gallery-intro" style="visibility:hidden;opacity:0">
        <p class="kicker">PHOTOGRAPHY / THE ARCHIVE</p>
        <h1 id="collection-gallery-title"></h1>
        <p id="collection-gallery-description"></p>
      </header>

      <div id="collection-gallery-grid" class="collection-gallery__grid" aria-live="polite"></div>
    </div>
  </section>
</main>

<div class="photo-lightbox" id="photo-lightbox" role="dialog" aria-modal="true" aria-label="Photograph viewer" hidden>
  <button class="photo-lightbox__close" type="button" aria-label="Close photograph viewer">×</button>
  <button class="photo-lightbox__previous" type="button" aria-label="Previous photograph">←</button>

  <figure class="photo-lightbox__figure">
    <div class="photo-lightbox__print">
      <img class="photo-lightbox__image" alt="">
      <figcaption class="photo-lightbox__caption"></figcaption>
    </div>
    <img class="photo-lightbox__foreground" src="assets/images/photography-desk-refined.png" alt="" aria-hidden="true">
  </figure>

  <button class="photo-lightbox__next" type="button" aria-label="Next photograph">→</button>
  <div class="photo-lightbox__counter" aria-live="polite"></div>
</div>
