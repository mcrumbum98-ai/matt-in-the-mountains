<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page Not Found | Matt in the Mountains</title>
  <link rel="stylesheet" href="/assets/css/site.css">
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      background: #1c2a18;
      color: #fff;
    }
    .not-found__content { max-width: 650px; }
    .not-found h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      margin: 0 0 20px;
    }
    .not-found p {
      font-size: 1.15rem;
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .not-found a {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 5px;
    }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found__content">
      <h1>Trail Not Found</h1>
      <p>Looks like this trail leads nowhere. The page may have moved, been unpublished, or never existed.</p>
      <a href="/">Return to Matt in the Mountains</a>
    </div>
  </main>
</body>
</html>
